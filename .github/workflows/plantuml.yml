name: Generate PlantUML Diagrams

on:
  push:
    paths:
      - '**.puml' # Запускать только при изменениях .puml файлов

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Важно: даёт право на запись в репозиторий

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Нужно, чтобы получить историю изменений

      - name: Get changed UML files
        id: getfile
        run: |
          # Находим .puml файлы, которые изменились в последнем коммите
          echo "files=$(git diff --name-only HEAD^ HEAD | grep .puml | xargs)" >> $GITHUB_OUTPUT

      - name: Generate SVG Diagrams
        uses: holowinski/plantuml-github-action@main # Одна из популярных и поддерживаемых Actions
        if: ${{ steps.getfile.outputs.files != '' }}
        with:
          args: -v -tsvg ${{ steps.getfile.outputs.files }} # -tsvg = формат SVG

      - name: Push Local Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        if: ${{ steps.getfile.outputs.files != '' }}
        with:
          commit_message: "Generate SVG images for PlantUML diagrams"
          branch: ${{ github.head_ref }}
